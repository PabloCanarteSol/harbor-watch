name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install --upgrade pip && pip install -r requirements.txt || true
      - name: Lint + compile check
        run: |
           set -e
           echo "Checking Python syntax..."
           for f in config.py main.py src/*.py data/db py; do
              python3 -m py_compile "$f" || exit 1
            done
            echo "All files compile OK
