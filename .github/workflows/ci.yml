name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint + compile check
        run: |
          set -e
          for f in config.py main.py src/*.py data/db.py; do
            python3 -m py_compile "$f" || exit 1
          done
          echo "All files compile OK"

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps + test deps
        run: pip install --upgrade pip && pip install -r requirements.txt -r requirements-test.txt
      - name: Run tests
        run: |
          set -e
          echo "Running pytest..."
          python3 -m pytest tests/ -v
